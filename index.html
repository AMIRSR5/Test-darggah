<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تست پرداخت بله</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#6b7280;--accent:#00a884;--border:#e5e7eb}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f24;--text:#eef0f3;--muted:#9aa3ad;--border:#2a3038}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font-family:Tahoma,system-ui,sans-serif;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:360px;width:100%;text-align:center}
  h1{font-size:20px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 18px;font-size:14px}
  .price{font-size:32px;font-weight:700;margin-bottom:18px}
  .price small{font-size:14px;color:var(--muted);font-weight:400}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.6;cursor:wait}
  #msg{margin-top:14px;font-size:14px;min-height:20px;word-break:break-word}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">در حال بارگذاری…</h1>
  <p id="desc"></p>
  <div class="price"><span id="price">—</span> <small>تومان</small></div>
  <button id="buy" disabled>خرید اشتراک</button>
  <div id="msg"></div>
</div>

<script>
// ↓↓↓ فقط این دو مقدار را پر کنید (Supabase > Project Settings > API) ↓↓↓
const SUPABASE_URL = "https://rrsqesasjbcslwgmzeoz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyc3Flc2FzamJjc2x3Z216ZW96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4Njk1NzQsImV4cCI6MjEwNjQ0NTU3NH0.Jdl_sr2YeFi619i8DrbnUJKHHcMEWv3iQUxbE1wHQ3s";
// ↑↑↑ ---------------------------------------------------------------- ↑↑↑
const PLAN_ID = "basic";

const H = { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" };
const $ = id => document.getElementById(id);
const fa = n => Number(n).toLocaleString("fa-IR");
const rpc = (name, body) => fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, { method: "POST", headers: H, body: JSON.stringify(body) }).then(r => r.json());

async function loadPlan() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/plans?id=eq.${PLAN_ID}&select=*`, { headers: H });
    const [p] = await r.json();
    $("title").textContent = p.title;
    $("desc").textContent = p.description || "";
    $("price").textContent = fa(p.price_toman);
    $("buy").disabled = false;
  } catch { $("title").textContent = "خطا در بارگذاری پلن"; }
}

function poll(orderId) {
  $("msg").textContent = "منتظر تایید پرداخت…";
  const t = setInterval(async () => {
    const s = await rpc("get_order_status", { order_id: orderId }).catch(() => null);
    if (s === "paid") {
      clearInterval(t);
      $("msg").textContent = "✅ پرداخت موفق بود. اشتراک شما فعال شد.";
      $("buy").disabled = true;
      localStorage.removeItem("order_id");
    }
  }, 3000);
}

$("buy").onclick = async () => {
  $("buy").disabled = true; $("msg").textContent = "در حال ساخت فاکتور…";
  try {
    const d = await rpc("create_order", { p_plan_id: PLAN_ID });
    if (!d.link) throw new Error(JSON.stringify(d));
    localStorage.setItem("order_id", d.order_id);
    let link = String(d.link).trim();
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(link)) {
      link = link.startsWith("//") ? "https:" + link : "https://" + link.replace(/^\/+/, "");
    }
    const a = document.createElement("a");
    a.href = link; a.textContent = "اگر منتقل نشدی اینجا بزن"; a.style.color = "var(--accent)";
    $("msg").textContent = ""; $("msg").appendChild(a);
    window.location.href = link;   // رفتن به پرداخت بله
  } catch (e) {
    $("msg").textContent = "خطا: " + e.message; $("buy").disabled = false;
  }
};

loadPlan();
const pending = localStorage.getItem("order_id");
if (pending) poll(pending);
</script>
</body>
</html>
